name: Protocol question or spec feedback
description: Question about the protocol design or feedback on the spec
labels: [spec, question]
body:
  - type: textarea
    id: question
    attributes:
      label: Question or feedback
      description: What's unclear or what would you like to change about the protocol?
    validations:
      required: true
  - type: input
    id: spec_ref
    attributes:
      label: Spec reference (optional)
      description: Which spec file or section does this relate to?
