name: Bug report
description: Something in the implementation is wrong or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If this is a **security vulnerability**, please do not open an issue.
        See [SECURITY.md](../../SECURITY.md) for how to report privately.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What did you expect to happen and what actually happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal code or steps to reproduce the issue
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Package version or commit SHA
    validations:
      required: true
