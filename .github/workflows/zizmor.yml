name: zizmor

# Static security analysis of the GitHub Actions workflows. Catches dangerous
# triggers, template injection, unpinned actions and over-broad permissions so a
# workflow-security regression fails a PR rather than landing silently. Runs on
# every pull request and push to main so the check is always present, plus a
# daily schedule. zizmor is pinned through the flake (nix develop), and runs
# offline so the gate is deterministic and needs no token.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 7 * * *"

permissions: {}

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Analyze workflows
        run: nix develop --command zizmor --offline .github/workflows/

      - name: Workflow trust checks
        # Two things zizmor does not cover, each added because a real bug got
        # past review: a credentialed job installing without --ignore-scripts
        # (the Shai-Hulud vector), and a pinned action SHA that is not a real
        # commit upstream. zizmor returned clean on both. GITHUB_TOKEN is
        # read-only here and is used solely to resolve action SHAs against the
        # public API; without it the pin check reports SKIPPED rather than
        # passing silently.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix develop --command npm run check:workflows
