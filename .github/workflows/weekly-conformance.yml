name: weekly-conformance

# Standing re-verification of the conformance corpus, on a cadence rather than
# on a push. CI only runs when someone pushes or opens a pull request, so a
# quiet week leaves no evidence that the corpus is still green and no signal
# that something outside the repository has drifted under it. This workflow runs
# every Monday and produces that evidence: both implementations over the whole
# corpus including the staged category, the manifest checked against the vectors
# on disk and the documented-fact check with registry verification required so
# a dist-tag that moves without the pin is caught within a week.
#
# There is no reporting step and no summary artifact. A red run is the signal.
#
# Recorded against the soak's corpus-greenness criterion in
# governance/releases/1.0-readiness-evidence.md, which asks for a weekly re-run
# at a pinned release tag. So a scheduled run verifies two commits: the default
# branch head, and the highest released `v*` tag.
#
# The highest `v*` tag is NOT by itself a soak anchor. No soak window is open
# while the conformance corpus is generated from the implementation it
# validates, so this job re-verifying the newest tag is corpus-greenness
# evidence and nothing more. When a window does open it will pin a specific
# tag, and that pin lives in the readiness evidence, not in this heuristic.
#
# When both refs resolve to the same commit the work is done once and labelled
# as covering both. A manual dispatch still verifies exactly the one ref it is
# given.

on:
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag, branch or commit to verify. Empty means the default branch."
        required: false
        type: string

permissions: {}

concurrency:
  group: weekly-conformance-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  provenance:
    # A run is only citable if its provenance is unambiguous. A manual dispatch
    # selects the workflow content along with the ref, so a run whose workflow
    # did not come from main could pass on doctored checks and read as evidence.
    # Refuse that combination outright, resolve the requested ref against the
    # repository over the API rather than trusting the input string, and print
    # the exact commit every job then verifies, so the ledger records a SHA and
    # not a movable name.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # A JSON array of {label, ref, sha, live}, one entry per commit to
      # verify. The three jobs below fan out over it. `live` marks the entry
      # that is the current branch head: checks that compare the tree to the
      # world as it is now, like the registry comparison, only make sense
      # there. A historical tag's facts are frozen with the tag.
      targets: ${{ steps.resolve.outputs.targets }}
    steps:
      - name: Require the workflow itself to run from main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "Dispatch this workflow from main. The ref to verify goes in the 'ref' input;"
          echo "dispatching the workflow on another ref would run that ref's workflow content."
          exit 1

      - name: Resolve the refs under verification to commits
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          # `commits/<ref>` peels an annotated tag to the commit it points at,
          # so a tag resolves the same way a branch does.
          resolve() { gh api "repos/${GITHUB_REPOSITORY}/commits/$1" --jq .sha; }

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            ref="${REQUESTED:-${GITHUB_REF_NAME}}"
            sha=$(resolve "$ref")
            head_sha=$(resolve "${GITHUB_REF_NAME}")
            targets=$(jq -cn --arg ref "$ref" --arg sha "$sha" \
              --argjson live "$([ "$sha" = "$head_sha" ] && echo true || echo false)" \
              '[{label: $ref, ref: $ref, sha: $sha, live: $live}]')
          else
            head_ref="${GITHUB_REF_NAME}"
            head_sha=$(resolve "$head_ref")

            # Released tags only: `v<major>.<minor>.<patch>` and nothing else.
            # That drops prereleases, which are not what a soak window pins,
            # and it drops the `latest-v*` dist-tag stamps described in
            # publish.yml. A `latest-v*` tag is a version-bump re-cut of an
            # already-soaked release, cut only to move the `latest` dist-tag;
            # the load-bearing reason to exclude it is that a promotion of the
            # newest line would sort above the release under
            # soak and would quietly move the weekly run off the pinned tag the
            # ledger cites. Sorting is numeric per field, so v0.16.0 ranks
            # above v0.9.0 the way a lexical sort would not.
            # The API listing must fail the run, not fall back: a rate limit or
            # 5xx that read as "no tags" would drop the release-tag leg while
            # the run still passed. Only an empty match set is tolerable.
            all_tags=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/tags" --jq '.[].name')
            tag=$(printf '%s\n' "$all_tags" \
              | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
              | sed 's/^v//' \
              | sort -t. -k1,1n -k2,2n -k3,3n \
              | tail -n1 \
              | sed 's/^/v/')

            if [ -z "$tag" ]; then
              # Nothing released yet. Verify the branch and say so, rather than
              # failing a cadence run over a tag that does not exist.
              echo "no released v* tag found, verifying ${head_ref} only"
              targets=$(jq -cn --arg ref "$head_ref" --arg sha "$head_sha" \
                '[{label: $ref, ref: $ref, sha: $sha, live: true}]')
            else
              tag_sha=$(resolve "$tag")
              if [ "$tag_sha" = "$head_sha" ]; then
                # The release is the branch head. One verification covers both,
                # and the label records that so the ledger can cite this run
                # for the tag.
                targets=$(jq -cn --arg ref "$head_ref" --arg tag "$tag" --arg sha "$head_sha" \
                  '[{label: ($ref + " and " + $tag), ref: $ref, sha: $sha, live: true}]')
              else
                targets=$(jq -cn \
                  --arg ref "$head_ref" --arg head_sha "$head_sha" \
                  --arg tag "$tag" --arg tag_sha "$tag_sha" \
                  '[{label: $ref, ref: $ref, sha: $head_sha, live: true},
                    {label: $tag, ref: $tag, sha: $tag_sha, live: false}]')
              fi
            fi
          fi

          # One line per commit, so a ledger citation can be read straight off
          # the log: what it covers, the ref it came from and the immutable SHA.
          echo "$targets" | jq -r '.[] | "verifying \(.label): ref \(.ref) at \(.sha)"'
          echo "targets=${targets}" >> "$GITHUB_OUTPUT"

  reference-corpus:
    needs: provenance
    # The TypeScript reference over the full corpus. `npm test` carries the
    # conformance and manifest-integrity suites, so this covers both the
    # per-vector decisions and the assertion that the vectors on disk, the
    # declared category set and every per-category digest in
    # conformance/v1/manifest.json agree.
    name: reference-corpus (${{ matrix.target.label }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Each commit is separate evidence. A red branch head must not cancel the
      # run at the release tag the soak ledger cites, or the other way round.
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.provenance.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.target.sha }}
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      # Deliberately no npm or Nix store cache here. A cache is shared across
      # workflows and outlives the run, and this workflow's whole purpose is to
      # re-verify from scratch on a schedule. Restoring a warm store would let a
      # stale artifact stand in for the thing being verified.
      - name: Install npm deps
        run: nix develop --command npm ci

      - name: Reference conformance and manifest integrity
        run: nix develop --command npm test

      - name: Reference, staged vectors
        run: nix develop --command npm run test:staged

      - name: Documented-fact drift check
        # CHECK_FACTS_REQUIRE_NPM turns an unreachable or disagreeing registry
        # into a failure instead of an unverified pin. On the weekly cadence
        # this is what catches a dist-tag that moved without the pin in the
        # repository moving with it, whether or not anyone pushed that week.
        # Only on the live branch head: a historical tag's pin records the
        # registry as it stood at the tag, so comparing it to today's registry
        # would fail every tag leg forever once any later release published.
        if: ${{ fromJSON(matrix.target.live) }}
        env:
          CHECK_FACTS_REQUIRE_NPM: "1"
        run: nix develop --command npm run check:facts

  go-corpus:
    needs: provenance
    # The independent Go verifier over the same corpus and the same
    # manifest-integrity cross-check, plus the staged category with enforcement
    # on. A skipped staged test exits 0, so assert it actually ran.
    name: go-corpus (${{ matrix.target.label }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.provenance.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.target.sha }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false

      - name: Go conformance and manifest integrity
        working-directory: go
        run: go test ./...

      - name: Go verifier, staged vectors
        working-directory: go
        env:
          INK_STAGED_CONFORMANCE: "1"
        run: |
          set -euo pipefail
          go test ./ink/
          log="${RUNNER_TEMP:-/tmp}/staged.log"
          go test ./ink/ -run TestAgentCardSignaturePhaseC -v > "$log"
          cat "$log"
          grep -q '^--- PASS: TestAgentCardSignaturePhaseC' "$log"

  go-ts-interop:
    needs: provenance
    # The cross-implementation check: the Go witness issues, the TypeScript
    # reference verifies. Agreement between the two implementations is the
    # claim the corpus evidence rests on, so it is re-run on the same cadence.
    name: go-ts-interop (${{ matrix.target.label }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.provenance.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.target.sha }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Install npm deps
        run: nix develop --command npm ci

      - name: Go witness issues, TypeScript reference verifies
        run: nix develop --command npx vitest run test/go-witness-interop.test.ts
