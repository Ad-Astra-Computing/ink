name: promote

# Manually promote an already-published version to a dist-tag (e.g. next -> latest).
# Publishing new versions stays in publish.yml (OIDC trusted publishing, always
# `--tag next`). `latest` only advances through this deliberate, audited run.
#
# OIDC trusted publishing authenticates `npm publish` only, not `npm dist-tag`,
# so this job uses an automation/granular token (NPM_TOKEN secret) which is also
# exempt from account 2FA. Create one with read-write on @adastracomputing/ink
# and add it as the `NPM_TOKEN` repository secret.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published version to promote (e.g. 0.2.0)"
        required: true
        type: string
      dist_tag:
        description: "dist-tag to set"
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"

      # Inputs are passed through the environment and quoted in every command so
      # a crafted `version`/`dist_tag` cannot inject shell.
      - name: Validate inputs
        env:
          VERSION: ${{ inputs.version }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Refusing: '$VERSION' is not a valid semver." >&2
            exit 1
          fi
          case "$DIST_TAG" in
            latest|next) : ;;
            *) echo "Refusing: unexpected dist-tag '$DIST_TAG'." >&2; exit 1 ;;
          esac

      - name: Verify the version is published
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! npm view "@adastracomputing/ink@${VERSION}" version >/dev/null 2>&1; then
            echo "Refusing: @adastracomputing/ink@${VERSION} is not published." >&2
            exit 1
          fi

      - name: Smoke — clean install + import the target version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          tmp="$(mktemp -d)"
          cd "$tmp"
          printf '{"type":"module","private":true}' > package.json
          npm install "@adastracomputing/ink@${VERSION}"
          node --input-type=module -e "
            const ink = await import('@adastracomputing/ink');
            const need = ['signInkMessage','deriveAgentId','encryptInkPayload','INK_PROTOCOL_VERSIONS'];
            const missing = need.filter((n) => !(n in ink));
            if (missing.length) throw new Error('missing exports: ' + missing.join(', '));
            console.log('smoke ok', ink.INK_PROTOCOL_VERSIONS);
          "

      - name: Promote dist-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          echo "Before:"
          npm dist-tag ls @adastracomputing/ink
          npm dist-tag add "@adastracomputing/ink@${VERSION}" "${DIST_TAG}"
          echo "After:"
          npm dist-tag ls @adastracomputing/ink
