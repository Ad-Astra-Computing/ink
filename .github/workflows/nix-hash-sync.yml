name: nix-hash-sync

on:
  # pull_request_target is required: the job commits the recomputed hash back to
  # the PR branch, which pull_request cannot do. Risk is mitigated by gating to
  # same-repo Dependabot PRs only (see the job `if`), least-privilege, and
  # persist-credentials:false. Accepted intentionally.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize]
    paths: [package-lock.json]

# Deny by default; the one job elevates to exactly what it needs.
permissions: {}

concurrency:
  group: nix-hash-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    # pull_request_target runs with repo write + secrets, so gate hard: only
    # Dependabot's own PRs, and only when they originate from a branch in THIS
    # repo (never a fork). The PR-author login is more robust than github.actor,
    # and the same-repo guard means the checked-out head is repo-controlled.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Pin to the immutable event SHA, not the mutable branch ref, so the
          # branch cannot move between event evaluation and checkout (TOCTOU).
          # The commit-back step targets head.ref explicitly via the API.
          ref: ${{ github.event.pull_request.head.sha }}
          # The repo token is provided per-step via GITHUB_TOKEN env, not git
          # config — never persist it into the checkout of PR-supplied code.
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Compute new npmDepsHash
        id: hash
        run: |
          NEW=$(nix run nixpkgs#prefetch-npm-deps -- package-lock.json)
          # prefetch-npm-deps already prints the sha256- prefix; strip any
          # existing prefix before re-adding one so the hash is never
          # double-prefixed (which produces an unparseable SRI hash).
          NEW=${NEW#sha256-}
          echo "value=sha256-${NEW}" >> "$GITHUB_OUTPUT"

      - name: Read current hash
        id: current
        run: |
          CURRENT=$(grep -oE 'npmDepsHash = "sha256-[A-Za-z0-9+/=]*"' flake.nix | head -1 | sed -E 's/.*"(sha256-[^"]*)".*/\1/')
          echo "value=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Update flake.nix and commit via API (signed)
        if: steps.hash.outputs.value != steps.current.outputs.value
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_HASH: ${{ steps.hash.outputs.value }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          sed -i "s|npmDepsHash = \"sha256-[A-Za-z0-9+/=]*\"|npmDepsHash = \"${NEW_HASH}\"|g" flake.nix
          ENCODED=$(base64 -w0 flake.nix)
          CURRENT_SHA=$(gh api "repos/${{ github.repository }}/contents/flake.nix?ref=${PR_BRANCH}" --jq '.sha')
          gh api -X PUT "repos/${{ github.repository }}/contents/flake.nix" \
            -f message="flake: sync npmDepsHash after dependency bump" \
            -f content="$ENCODED" \
            -f sha="$CURRENT_SHA" \
            -f branch="$PR_BRANCH"
