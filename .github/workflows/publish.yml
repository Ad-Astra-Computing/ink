name: publish

on:
  push:
    tags:
      # `v*` cuts a normal release to the `next` dist-tag. `latest-v*` re-cuts
      # an already-soaked version and stamps it adopter-grade on `latest`. The
      # two patterns are disjoint, and each is handled by its own job.
      - "v*"
      - "latest-v*"
  workflow_dispatch:
    inputs:
      promote_version:
        description: "Fallback only: move a dist-tag onto this already-published version"
        required: false
        default: ""
        type: string
      promote_tag:
        description: "dist-tag to move when promoting"
        required: false
        default: latest
        type: choice
        options:
          - latest
          - next

# Deny by default at the workflow level; each job grants exactly what it needs.
permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    # Normal releases only, and only ever from a tag push. A `latest-v*` tag is
    # handled by publish-latest, and a promotion dispatch is handled by promote.
    # No workflow_dispatch arm: npm's trusted publisher authenticates the repo
    # and workflow identity, not the ref, so a dispatch-triggered publish would
    # run OIDC-authenticated `npm publish` from whatever ref was selected.
    if: github.event_name == 'push' && !startsWith(github.ref_name, 'latest-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required for `gh release create` to publish the GitHub Release after npm publish.
      id-token: write   # required for npm provenance (sigstore OIDC).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      # No build cache on the publish path: a poisoned cross-workflow cache could
      # influence the artifact this job publishes. Publishing is infrequent, so
      # the cold nix build is an acceptable cost for removing that vector.

      - name: Install npm deps
        run: nix develop --command npm ci

      - name: Tests
        run: nix develop --command npm test

      - name: Typecheck
        run: nix develop --command npm run typecheck

      - name: Lint
        run: nix develop --command npm run lint

      - name: Public-surface drift check
        run: nix develop --command npm run check:surface

      - name: Pack-and-import smoke
        # Builds the tarball with the same hooks publish uses, installs
        # it into a clean directory, and imports the entry point. Catches
        # any release that would ship a broken package (missing dist/,
        # wrong main, unresolvable re-exports, raw TS sneaking back in).
        run: nix develop --command npm run check:pack

      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Verify the dist-tag pin describes this release
        # governance/releases/npm-dist-tags.json is the offline source of truth
        # for every dist-tag quoted in prose, and check:facts fails once the
        # registry moves past it. Checking it here, before the publish, keeps
        # that failure at release time instead of landing on `main` afterwards,
        # and makes the pin bump part of the release commit as GOVERNANCE.md
        # requires. Runs after the gauntlet and before `npm publish`, so a
        # missing pin bump costs a re-cut and never a published release.
        run: nix develop --command npm run check:release-pin -- --tag next --version "${GITHUB_REF_NAME#v}" --match-package-version

      # No `cache:` input, so setup-node does not actually cache anything here —
      # the heuristic flag is a false positive on the publish path.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        # Pre-1.0 releases publish under the `next` dist-tag, NOT
        # `latest`. The 0.1.x line is wire-compatible across patches
        # (`ink/0.1` is frozen) but the API surface and trust semantics
        # remain alpha-quality — see docs/maturity.md. `latest` only
        # advances when a soaked version is re-cut as a patch and tagged
        # `latest-v<ver>`, which the publish-latest job below stamps, so
        # bare `npm install @adastracomputing/ink` only picks up
        # versions a maintainer has stamped adopter-grade. Adopters who
        # want the bleeding edge use `npm install @adastracomputing/ink@next`.
        run: npm publish --access public --provenance --tag next

      - name: Create GitHub Release from CHANGELOG
        # The release body is the matching CHANGELOG section, extracted by
        # scripts/changelog-section.sh so both publish paths read it the same
        # way. Reading from the file lives in-repo so future contributors
        # don't need a maintainer's machine to backfill or re-cut a release.
        # No external action, so no third-party SHA to keep updated, and no
        # privileged token beyond the default GITHUB_TOKEN which can only act
        # on this repo.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          body_file="$(mktemp)"
          ./scripts/changelog-section.sh "$version" > "$body_file"
          # All pre-1.0 releases are pre-release. Once a 1.0.0 lands
          # this should switch to a semver-based check on the tag.
          gh release create "$tag" \
            --title "$tag" \
            --notes-file "$body_file" \
            --prerelease

  publish-latest:
    # Tokenless promotion to the `latest` dist-tag. npm trusted publishing
    # authenticates `npm publish` over OIDC but not `npm dist-tag`
    # (npm/cli#8547), so a promotion is expressed as a publish: re-cut the
    # soaked version as a patch, then push a `latest-v<ver>` tag. This job
    # runs the same gauntlet as the publish job and needs no stored npm
    # credential. It carries the npm-release environment so environment
    # protection rules still gate every move of `latest`.
    #
    # The real authorization boundary is who can push a tag, not this `if:`.
    # npm's trusted publisher is scoped to this repository and this workflow
    # file, so it authenticates any job here; keep tag protection rules on
    # `latest-v*` in step with who may cut a release. The npm trusted-publisher
    # environment setting must stay unset, or the publish job (which has no
    # environment) would stop authenticating.
    if: github.event_name == 'push' && startsWith(github.ref_name, 'latest-v')
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: write   # required for `gh release create` to publish the GitHub Release after npm publish.
      id-token: write   # required for npm provenance (sigstore OIDC).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      # No build cache on the publish path, for the same reason as the publish
      # job above: a poisoned cross-workflow cache could influence the artifact.

      - name: Install npm deps
        run: nix develop --command npm ci

      - name: Tests
        run: nix develop --command npm test

      - name: Typecheck
        run: nix develop --command npm run typecheck

      - name: Lint
        run: nix develop --command npm run lint

      - name: Public-surface drift check
        run: nix develop --command npm run check:surface

      - name: Pack-and-import smoke
        run: nix develop --command npm run check:pack

      - name: Verify version matches tag
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#latest-v}"
          # A promotion always names a bare release version. Rejecting anything
          # else keeps a prerelease or build-metadata version off `latest`.
          if ! [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "promotion tag must be latest-v<major>.<minor>.<patch> (got: ${GITHUB_REF_NAME})"
            exit 1
          fi
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Verify the dist-tag pin describes this promotion
        # Same gate as the publish job, on the tag this path moves. A promotion
        # re-cut advances `latest`, so the pin's `latest` entry must already
        # name this version before the registry does.
        run: nix develop --command npm run check:release-pin -- --tag latest --version "${GITHUB_REF_NAME#latest-v}" --match-package-version

      # No `cache:` input, so setup-node does not actually cache anything here.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm as latest
        # The publish itself moves `latest`, under the same OIDC trusted
        # publishing identity as a normal release. This version is also on
        # `next` only if it was published there first; a promotion re-cut is a
        # new patch, so it lands on `latest` alone until the next `v*` release.
        run: npm publish --access public --provenance --tag latest

      - name: Create GitHub Release from CHANGELOG
        # Titled with the normalized version even though the git tag carries
        # the `latest-` prefix, and not marked prerelease: this release is the
        # adopter-grade stamp.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#latest-v}"
          body_file="$(mktemp)"
          ./scripts/changelog-section.sh "$version" > "$body_file"
          gh release create "$tag" \
            --title "v${version}" \
            --notes-file "$body_file"

  promote:
    # Fallback path. The preferred way to move `latest` is the tokenless
    # `latest-v*` re-cut handled by publish-latest above, which authenticates
    # over OIDC and needs no stored credential. This job moves the dist-tag on
    # an already-published version instead, which npm trusted publishing cannot
    # authenticate (npm/cli#8547), so it needs a real automation token in
    # NPM_TOKEN: a granular read-write token for @adastracomputing/ink on the
    # npm-promote environment, which only deployments from main can reach. No such token is kept long-term, so using this
    # path means minting a fresh one first and revoking it afterwards. Use it
    # only when a re-cut is not viable, for example rolling `latest` back to an
    # earlier version. Runs only on a manual dispatch that supplies
    # promote_version.
    if: github.event_name == 'workflow_dispatch' && inputs.promote_version != ''
    runs-on: ubuntu-latest
    environment: npm-promote
    permissions:
      contents: read   # required to read the committed dist-tag pin before moving a tag.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pin's authority is the protected default branch: the runbook
          # requires `main` to name the destination before a tag moves. Pinning
          # the checkout also keeps dispatch-selected refs from running code in
          # this credentialed job.
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"

      - name: Verify the dist-tag pin describes this move
        # This path moves a dist-tag on an already-published version, so it is
        # the one place where the registry can advance without a publish. The
        # pin has to name the destination before the move, or `main` goes red
        # afterwards. Run under bare node (no `npm ci`, no Nix) so this
        # credentialed job installs nothing before it moves the tag.
        env:
          PROMOTE_VERSION: ${{ inputs.promote_version }}
          PROMOTE_TAG: ${{ inputs.promote_tag }}
        run: node scripts/check-release-pin.ts --tag "$PROMOTE_TAG" --version "$PROMOTE_VERSION"

      - name: Promote dist-tag
        env:
          PROMOTE_VERSION: ${{ inputs.promote_version }}
          PROMOTE_TAG: ${{ inputs.promote_tag }}
          PKG: "@adastracomputing/ink"
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if ! [[ "$PROMOTE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "promote_version must be a bare semver (got: $PROMOTE_VERSION)"
            exit 1
          fi
          case "$PROMOTE_TAG" in
            latest|next) ;;
            *) echo "promote_tag must be latest or next (got: $PROMOTE_TAG)"; exit 1 ;;
          esac
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is not set on the npm-release environment. Add a granular"
            echo "read-write npm token for @adastracomputing/ink and re-run; trusted-"
            echo "publishing OIDC cannot move dist-tags (npm/cli#8547)."
            exit 1
          fi
          echo "Before:"
          npm dist-tag ls "$PKG"
          npm dist-tag add "${PKG}@${PROMOTE_VERSION}" "$PROMOTE_TAG"
          echo "After:"
          npm dist-tag ls "$PKG"
