name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # required for `gh release create` to publish the GitHub Release after npm publish.
  id-token: write   # required for npm provenance (sigstore OIDC).

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Install npm deps
        run: nix develop --command npm ci

      - name: Tests
        run: nix develop --command npm test

      - name: Typecheck
        run: nix develop --command npm run typecheck

      - name: Lint
        run: nix develop --command npm run lint

      - name: Public-surface drift check
        run: nix develop --command npm run check:surface

      - name: Pack-and-import smoke
        # Builds the tarball with the same hooks publish uses, installs
        # it into a clean directory, and imports the entry point. Catches
        # any release that would ship a broken package (missing dist/,
        # wrong main, unresolvable re-exports, raw TS sneaking back in).
        run: nix develop --command npm run check:pack

      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        # Pre-1.0 releases publish under the `next` dist-tag, NOT
        # `latest`. The 0.1.x line is wire-compatible across patches
        # (`ink/0.1` is frozen) but the API surface and trust semantics
        # remain alpha-quality — see docs/maturity.md. `latest` only
        # advances when a release is explicitly promoted, with:
        #   npm dist-tag add @adastracomputing/ink@<ver> latest
        # so bare `npm install @adastracomputing/ink` only picks up
        # versions a maintainer has stamped adopter-grade. Adopters who
        # want the bleeding edge use `npm install @adastracomputing/ink@next`.
        run: npm publish --access public --provenance --tag next

      - name: Create GitHub Release from CHANGELOG
        # The release body is the matching CHANGELOG section. Reading
        # from the file lives in-repo so future contributors don't
        # need a maintainer's machine to backfill or re-cut a release.
        # Heredoc + literal markdown is intentional — no external action,
        # so no third-party SHA to keep updated, and no privileged token
        # beyond the default GITHUB_TOKEN which can only act on this repo.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          # Extract the CHANGELOG block from `## <version>(,|$)` up to
          # (but not including) the next `## ` heading. Drop the leading
          # heading line; the release title carries the version already.
          body_file="$(mktemp)"
          awk -v p="^## ${version}(,|\$)" '
            $0 ~ p { in_block=1; next }
            in_block && /^## / { in_block=0 }
            in_block { print }
          ' CHANGELOG.md > "$body_file"
          if [ ! -s "$body_file" ]; then
            echo "No CHANGELOG section found for ${version}; skipping release body."
            echo "Refer to CHANGELOG.md for changes." > "$body_file"
          fi
          # All pre-1.0 releases are pre-release. Once a 1.0.0 lands
          # this should switch to a semver-based check on the tag.
          gh release create "$tag" \
            --title "$tag" \
            --notes-file "$body_file" \
            --prerelease
