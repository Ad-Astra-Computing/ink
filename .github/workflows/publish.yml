name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      promote_version:
        description: "Promote this already-published version to a dist-tag (leave empty to publish the current tag)"
        required: false
        default: ""
        type: string
      promote_tag:
        description: "dist-tag to move when promoting"
        required: false
        default: latest
        type: choice
        options:
          - latest
          - next

# Deny by default at the workflow level; each job grants exactly what it needs.
permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    # Skip on a promotion dispatch; the promote job handles those.
    if: github.event_name == 'push' || inputs.promote_version == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required for `gh release create` to publish the GitHub Release after npm publish.
      id-token: write   # required for npm provenance (sigstore OIDC).
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      # No build cache on the publish path: a poisoned cross-workflow cache could
      # influence the artifact this job publishes. Publishing is infrequent, so
      # the cold nix build is an acceptable cost for removing that vector.

      - name: Install npm deps
        run: nix develop --command npm ci

      - name: Tests
        run: nix develop --command npm test

      - name: Typecheck
        run: nix develop --command npm run typecheck

      - name: Lint
        run: nix develop --command npm run lint

      - name: Public-surface drift check
        run: nix develop --command npm run check:surface

      - name: Pack-and-import smoke
        # Builds the tarball with the same hooks publish uses, installs
        # it into a clean directory, and imports the entry point. Catches
        # any release that would ship a broken package (missing dist/,
        # wrong main, unresolvable re-exports, raw TS sneaking back in).
        run: nix develop --command npm run check:pack

      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      # No `cache:` input, so setup-node does not actually cache anything here —
      # the heuristic flag is a false positive on the publish path.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6 # zizmor: ignore[cache-poisoning]
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        # Pre-1.0 releases publish under the `next` dist-tag, NOT
        # `latest`. The 0.1.x line is wire-compatible across patches
        # (`ink/0.1` is frozen) but the API surface and trust semantics
        # remain alpha-quality — see docs/maturity.md. `latest` only
        # advances when a release is explicitly promoted, with:
        #   npm dist-tag add @adastracomputing/ink@<ver> latest
        # so bare `npm install @adastracomputing/ink` only picks up
        # versions a maintainer has stamped adopter-grade. Adopters who
        # want the bleeding edge use `npm install @adastracomputing/ink@next`.
        run: npm publish --access public --provenance --tag next

      - name: Create GitHub Release from CHANGELOG
        # The release body is the matching CHANGELOG section. Reading
        # from the file lives in-repo so future contributors don't
        # need a maintainer's machine to backfill or re-cut a release.
        # Heredoc + literal markdown is intentional — no external action,
        # so no third-party SHA to keep updated, and no privileged token
        # beyond the default GITHUB_TOKEN which can only act on this repo.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          # Extract the CHANGELOG block from `## <version>(,|$)` up to
          # (but not including) the next `## ` heading. Drop the leading
          # heading line; the release title carries the version already.
          body_file="$(mktemp)"
          awk -v p="^## ${version}(,|\$)" '
            $0 ~ p { in_block=1; next }
            in_block && /^## / { in_block=0 }
            in_block { print }
          ' CHANGELOG.md > "$body_file"
          if [ ! -s "$body_file" ]; then
            echo "No CHANGELOG section found for ${version}; skipping release body."
            echo "Refer to CHANGELOG.md for changes." > "$body_file"
          fi
          # All pre-1.0 releases are pre-release. Once a 1.0.0 lands
          # this should switch to a semver-based check on the tag.
          gh release create "$tag" \
            --title "$tag" \
            --notes-file "$body_file" \
            --prerelease

  promote:
    # Move an already-published version's dist-tag (e.g. next -> latest) with no
    # static npm token. npm only runs the trusted-publishing OIDC handshake for
    # `npm publish`, so this exchanges the GitHub OIDC token for a short-lived npm
    # token by hand (npm/cli#8547) and uses it for the dist-tag move. Runs only on
    # a manual dispatch that supplies promote_version; the trusted publisher is
    # keyed to this workflow filename, so the promotion must live here, not in a
    # separate workflow.
    if: github.event_name == 'workflow_dispatch' && inputs.promote_version != ''
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      id-token: write   # exchange the GitHub OIDC token for a short-lived npm token.
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6 # zizmor: ignore[cache-poisoning]
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"

      - name: Promote dist-tag via OIDC token exchange
        env:
          PROMOTE_VERSION: ${{ inputs.promote_version }}
          PROMOTE_TAG: ${{ inputs.promote_tag }}
          PKG: "@adastracomputing/ink"
          PKG_ENC: "@adastracomputing%2Fink"
        run: |
          set -euo pipefail
          if ! [[ "$PROMOTE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "promote_version must be a bare semver (got: $PROMOTE_VERSION)"
            exit 1
          fi
          oidc="$(curl -sSf \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | jq -r '.value')"
          token="$(curl -sSf -X POST \
            -H "Authorization: Bearer ${oidc}" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${PKG_ENC}" | jq -r '.token')"
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "OIDC token exchange did not return a token"
            exit 1
          fi
          echo "::add-mask::$token"
          export NODE_AUTH_TOKEN="$token"
          echo "Before:"
          npm dist-tag ls "$PKG"
          npm dist-tag add "${PKG}@${PROMOTE_VERSION}" "$PROMOTE_TAG"
          echo "After:"
          npm dist-tag ls "$PKG"
