# Differential fuzzing between the TypeScript reference and the Go
# implementation. See differential/README.md for what it does and does not
# prove.
#
# Two budgets: a few thousand cases on every pull request, which costs seconds,
# and a large budget on a schedule, which costs minutes. The pull-request run
# uses a FIXED seed so a failure is reproducible from the log alone; the
# scheduled run takes a random one and prints it, because that is where the
# searching happens.
#
# Everything runs through `nix develop`. The Go decider needs a toolchain, and
# the flake already pins one; declaring node and go versions here as well would
# be a second source that can drift from flake.lock.

name: differential

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed to replay a finding"
        required: false
      cases:
        description: "Case budget"
        required: false

permissions:
  contents: read

# Pull requests share a group per ref and supersede each other. Everything else
# is keyed by commit so a push cannot cancel a queued night.
concurrency:
  group: differential-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  differential:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # A scheduled night is evidence for one release, and `main` moves off
      # that release the moment the next change merges. The release leg runs
      # the same budget against the tree the dist-tag pin names, so a night
      # recorded as evidence for the release was run on the release. A pull
      # request only needs the main leg: it is testing its own head.
      matrix:
        leg: ${{ github.event_name == 'pull_request' && fromJSON('["main"]') || fromJSON('["main","release"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The release leg checks out a tag, and a shallow clone has none.
          fetch-depth: 0

      - name: check out the release under evaluation
        if: matrix.leg == 'release'
        run: |
          set -euo pipefail
          version=$(node -p 'require("./governance/releases/npm-dist-tags.json").distTags.next')
          case "$version" in ''|*[!0-9.]*) echo "unexpected pinned version: $version"; exit 1 ;; esac
          git checkout "v$version"
          echo "release leg at v$version, commit $(git rev-parse HEAD)"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      # Same npm cache key as ci.yml, so the two jobs share the download.
      - name: Cache npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      # The TypeScript decider runs under tsx, which is a node_modules binary,
      # so the fuzzer cannot start without this. Nix supplies the toolchains,
      # not the package's own dependencies.
      - name: Install npm deps
        run: nix develop --command npm ci

      # The negative control, and it runs FIRST. A count of agreeing cases is
      # only evidence if the comparison can report a disagreement at all, so a
      # harness that detects nothing must fail before its clean run is allowed
      # to mean anything. Two surfaces, because the fault is injected per
      # surface and one passing does not prove the mechanism works elsewhere.
      - name: self-test
        run: |
          nix develop --command node differential/run.mjs --self-test private-hostname --cases 200
          nix develop --command node differential/run.mjs --self-test signature-base --cases 200

      - name: pull request budget
        if: github.event_name == 'pull_request'
        run: nix develop --command node differential/run.mjs --cases 5000 --seed 1

      # Dispatch inputs reach the shell through the environment, never through
      # template expansion into the run block. Expanding them inline is code
      # injection: whoever can trigger the workflow chooses the text, and
      # zizmor fails the build for it.
      - name: scheduled budget
        if: github.event_name != 'pull_request'
        env:
          CASES: ${{ inputs.cases || '400000' }}
          SEED: ${{ inputs.seed || '' }}
        run: |
          set -euo pipefail
          case "$CASES" in ''|*[!0-9]*) echo "cases must be digits"; exit 1 ;; esac
          if [ -n "$SEED" ]; then
            case "$SEED" in *[!0-9]*) echo "seed must be digits"; exit 1 ;; esac
            nix develop --command node differential/run.mjs --cases "$CASES" --batch 20000 --seed "$SEED"
          else
            nix develop --command node differential/run.mjs --cases "$CASES" --batch 20000
          fi

      # A finding that dies with the job that found it is worthless. The run
      # seed is in the log, so the artifact plus the seed reproduces it.
      - name: upload findings
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: differential-findings-${{ matrix.leg }}
          path: differential/findings/
          if-no-files-found: ignore
