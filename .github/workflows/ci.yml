name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  nix-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Cache npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install npm deps
        run: nix develop --command npm ci

      - name: Tests
        run: nix develop --command npm test

      - name: Typecheck
        run: nix develop --command npm run typecheck

      - name: Lint
        run: nix develop --command npm run lint

      - name: Public-surface drift check
        run: nix develop --command npm run check:surface

      - name: Documented-fact drift check
        # Recomputes every derivable claim in the governance record, the specs,
        # the README and the changelog. CHECK_FACTS_REQUIRE_NPM makes an
        # unreachable registry a failure here rather than an unverified pin.
        env:
          CHECK_FACTS_REQUIRE_NPM: "1"
        run: nix develop --command npm run check:facts

      - name: Dist-tag pin describes the tree
        # The version in the tree must be recorded on some dist-tag in
        # governance/releases/npm-dist-tags.json. A version bump only happens in
        # a release commit and a release commit updates the pin with it, so this
        # holds on every commit. It puts a forgotten pin bump in front of a
        # reviewer instead of leaving it to surface as a red `main` after the
        # release has already published. The publish workflow runs the stricter
        # per-tag form of this check before it publishes anything.
        run: nix develop --command npm run check:release-pin -- --tag any

      - name: Examples flake check
        # Gates examples/flake.nix against the tree: a runnable example with
        # no dev shell, or a shell naming a directory that has moved, fails
        # here. The examples job below runs each shell for real.
        working-directory: examples
        run: nix flake check

      - name: Build nix package
        # Builds the cli derivation, which verifies npmDepsHash against the
        # lockfile. Catches a stale or malformed hash that the devshell-based
        # steps above never exercise.
        run: nix build .#default .#cli --no-link

      - name: Verify npm package would publish cleanly
        run: nix develop --command npm pack --dry-run

      - name: Pack-and-import smoke
        # Mirrors the publish job's tarball smoke. CI runs it on every
        # push so a broken-publish regression is caught long before a
        # release tag is cut.
        run: nix develop --command npm run check:pack

  node-24-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  interop-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Python interop tests, lint and types
        working-directory: examples/interop-cli
        run: nix develop --command bash -c "pytest -q && ruff check src tests && mypy src"

  examples:
    # The npm examples are what adopters copy, so they get the same
    # nix-shell treatment as the library: the shell supplies the runtime,
    # each example's own lockfile supplies its dependencies. The flake
    # check also gates examples/flake.nix against the tree, so a new
    # example with no dev shell fails here.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - docker-receiver
          - foreign-sender-receiver
          - reference-receiver
          - reference-rp
          - reference-sender
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Install, test and typecheck
        working-directory: examples/${{ matrix.example }}
        # --if-present because docker-receiver has no typecheck script.
        run: |
          nix develop "..#${{ matrix.example }}" --command bash -c \
            'npm ci && npm test && npm run typecheck --if-present'

  go-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Conformance, vet and format
        working-directory: go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -count=1 ./...
          CGO_ENABLED=0 go build -o "${RUNNER_TEMP:-/tmp}/ink" ./cmd/ink
          CGO_ENABLED=0 go build -o "${RUNNER_TEMP:-/tmp}/ink-verify-server" ./cmd/ink-verify-server
          CGO_ENABLED=0 go build -o "${RUNNER_TEMP:-/tmp}/ink-witness-server" ./cmd/ink-witness-server

  staged-conformance:
    # The staged conformance categories: rules that are agreed and anchored now
    # and become required on a scheduled date. They are skipped by the default
    # suites, so this job is the only place their accept/reject semantics run,
    # and it runs BOTH implementations over the same vectors with the staged
    # flag on. A divergence here is a divergence between the two verifiers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Cache npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install npm deps
        run: nix develop --command npm ci

      - name: TypeScript reference, staged vectors
        run: nix develop --command npm run test:staged

      # Runs through the devshell so the Go here is the one flake.lock pins,
      # the same one a contributor gets from `nix develop`. `nix develop` reads
      # the flake from the current directory, so this cannot use
      # `working-directory: go`; the cd happens inside the command.
      - name: Go verifier, staged vectors
        env:
          INK_STAGED_CONFORMANCE: "1"
        run: |
          nix develop --command bash -c '
            set -euo pipefail
            cd go
            go test -count=1 ./ink/
            log="${RUNNER_TEMP:-/tmp}/staged.log"
            go test -count=1 ./ink/ -run TestAgentCardSignaturePhaseC -v | tee "$log"
            # A skip exits 0, so assert the staged test actually ran and passed.
            grep -q "^--- PASS: TestAgentCardSignaturePhaseC" "$log"
          '

  go-ts-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Cache npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install npm deps
        run: nix develop --command npm ci

      - name: Go witness issues, TypeScript reference verifies
        run: nix develop --command npx vitest run test/go-witness-interop.test.ts
