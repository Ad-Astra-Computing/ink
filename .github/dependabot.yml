version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /examples/foreign-sender-receiver
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # The examples track the library's toolchain rather than leading it; skip
    # major bumps of the shared dev toolchain so they stay on the same
    # TypeScript and node typings as the library.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /examples/reference-receiver
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # esbuild is a transitive dependency of wrangler here and is pinned to a
      # patched version through the package.json overrides, so the lockfile is
      # already non-vulnerable. Dependabot's security updater does not account
      # for overrides and errors trying to bump wrangler's pinned requirement;
      # ignore it so it does not retry an update the overrides already applied.
      - dependency-name: "esbuild"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci

  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - nix

  # The examples and the Python interop client carry their own flakes, so
  # they need their own entries. Without one a lock sits at whatever nixpkgs
  # was current the day it was written.
  - package-ecosystem: nix
    directory: /examples
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - nix

  - package-ecosystem: nix
    directory: /examples/interop-cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - nix
