[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ink-interop"
version = "0.1.0"
description = "Standalone INK protocol reference client. Generates Ed25519 keys, builds envelopes, signs, and verifies — all without depending on @adastracomputing/ink."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Ad Astra Computing" }]
keywords = ["ink", "protocol", "did", "ed25519"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "cryptography>=42.0",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "mypy>=1.10",
    "ruff>=0.6",
]

[project.scripts]
ink-interop = "ink_interop.cli:app"

[project.urls]
Repository = "https://github.com/Ad-Astra-Computing/ink"
Spec = "https://ink.tulpa.network"

[tool.hatch.build.targets.wheel]
packages = ["src/ink_interop"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle + pyflakes
    "I",            # isort
    "N",            # pep8-naming
    "UP",           # pyupgrade
    "B",            # flake8-bugbear
    "C4",           # flake8-comprehensions
    "SIM",          # flake8-simplify
    "RUF",          # ruff-specific
    "S",            # bandit (security)
    "PTH",          # use pathlib
    "TID",          # tidy imports
]
ignore = [
    "S101",  # asserts in tests are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
# Import the package straight from src/ so `pytest` works from a fresh
# checkout (e.g. inside `nix develop`) with no editable install.
pythonpath = ["src"]
