name = "ink-reference-receiver"
main = "src/index.ts"
compatibility_date = "2026-06-02"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# NOTE: the values below (routes, KV id, host, public key) are the LIVE
# Ad Astra Computing deployment at ink-echo.tulpa.network. They are
# committed so the example is self-documenting, NOT so they can be
# reused. To run your own, replace every one of them with your own
# hostname, KV namespace id, and keypair.

# Custom domain creates the DNS record + cert. The explicit /* route is
# required to OVERRIDE a pre-existing wildcard worker route on the same
# zone — without it, that wildcard worker intercepts the subdomain. If
# your zone has no wildcard route, the custom-domain entry alone is
# enough; drop the /* route. Adopters: change the hostname and zone.
routes = [
  { pattern = "ink-echo.tulpa.network", custom_domain = true },
  { pattern = "ink-echo.tulpa.network/*", zone_name = "tulpa.network" },
]

# KV namespace. Run `wrangler kv namespace create INK_RECEIVER` and
# replace the id below with the one it returns.
[[kv_namespaces]]
binding = "INK_RECEIVER"
id = "1403de75d6e94c71897f9a8824a4c848"

# Public (non-secret) config. Replace both with your own values.
#   INK_RECEIVER_PUBLIC_KEY_MULTIBASE — multibase ed25519-pub of the
#     receiver's signing key. Must match the seed set as the secret
#     below; mint a keypair offline (see README) and paste both halves.
#   INK_RECEIVER_HOST — the bare hostname this worker answers on. Used
#     to derive the did:web id and the agent-card / inbound URLs.
[vars]
INK_RECEIVER_PUBLIC_KEY_MULTIBASE = "z6MknEs8ZYGD5yyTnT2LDrjhgTJMx6yXK1AmvxKBSPrQWZNi"
INK_RECEIVER_HOST = "ink-echo.tulpa.network"

# Secret (set via `wrangler secret put`, never in this file):
#   INK_RECEIVER_SIGNING_SEED — 32-byte Ed25519 seed, base64url-encoded.
#     Anyone with this can sign as this DID; treat it like a private key.
