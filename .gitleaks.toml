title = "INK Protocol gitleaks config"

# Inherit gitleaks' default ruleset (AWS, GitHub, GitLab, Stripe, generic
# API keys, JWTs, private-key PEMs, etc.). Without this, the workflow
# only catches the custom rule below and silently passes on every other
# secret class, a placebo defense.
[extend]
useDefault = true

# INK ships interop test vectors that contain deterministic Ed25519 keys and
# the public key multibase strings derived from them. They are not secrets,
# they are the whole point of the fixtures, and are documented as such in
# test-vectors/README.md and conformance/v1/README.md. Suppress ONLY the
# generic-api-key rule on those files so other secret classes (AWS keys,
# GitHub tokens, PEM blocks, etc.) still get caught if they ever slip in.
[[allowlists]]
description = "Deterministic test vector keys, generic-api-key only"
targetRules = ["generic-api-key"]
paths = [
  '''test-vectors/.*\.json$''',
  '''conformance/v1/vectors/.*\.json$''',
]

# The Python interop CLI's Keypair dataclass at
# examples/interop-cli/src/ink_interop/crypto.py declares its
# private-key field with the cryptography library's class as the type
# annotation. The generic-api-key rule trips on the type name (a long
# alphanumeric substring), not on any actual secret value. The class
# docstring documents that the raw key bytes are deliberately not
# exposed on the dataclass surface. Suppress ONLY the generic-api-key
# rule on this file so an actual secret would still be caught.
[[allowlists]]
description = "Python dataclass type annotation, generic-api-key only"
targetRules = ["generic-api-key"]
paths = [
  '''examples/interop-cli/src/ink_interop/crypto\.py$''',
]

# The Go verifier test suite embeds the same deterministic Ed25519 test
# keys and their hex encodings as the interop vectors, sometimes bound to
# a local named "key". They are fixtures, not secrets, and mirror the
# conformance vectors the Go CLI is checked against. Suppress ONLY the
# generic-api-key rule on the internal package tests so other secret
# classes still get caught if they ever slip in.
[[allowlists]]
description = "Deterministic Go verifier test-vector keys, generic-api-key only"
targetRules = ["generic-api-key"]
paths = [
  '''go/internal/.*_test\.go$''',
]

[[rules]]
id = "cloudflare-api-token"
description = "Cloudflare API token"
regex = '''\bcfat_[A-Za-z0-9]{40,}'''
keywords = ["cfat_"]
